name: Daily S&P 500 Screening + GitHub Pages

on:
  schedule:
    # Run at 7am EST (12:00 UTC) on weekdays
    - cron: '0 12 * * 1-5'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: 'Force refresh all fundamentals (ignore cache)'
        required: false
        type: boolean
        default: false

jobs:
  screen-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit cache + docs/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "time=$(date +'%H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Check existing fundamental cache
        id: cache-check
        run: |
          if [ -d "data/fundamentals_cache" ]; then
            CACHE_COUNT=$(ls data/fundamentals_cache/*_fundamentals.json 2>/dev/null | wc -l | tr -d ' ')
            echo "cached_stocks=$CACHE_COUNT" >> $GITHUB_OUTPUT
            echo "✓ Found $CACHE_COUNT cached fundamental files"
          else
            mkdir -p data/fundamentals_cache
            echo "cached_stocks=0" >> $GITHUB_OUTPUT
            echo "⚠ No cache found, will create"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run S&P 500 stock screening
        env:
          FORCE_FULL_REFRESH: ${{ github.event.inputs.force_full_refresh || 'false' }}
          CACHED_STOCKS: ${{ steps.cache-check.outputs.cached_stocks }}
        run: |
          echo "=== S&P 500 Screening ==="
          echo "  Universe: S&P 500 (~503 stocks)"
          echo "  Cached fundamentals: $CACHED_STOCKS stocks"
          echo ""
          mkdir -p data/daily_scans data/logs docs
          # --sp500 is default; --git-storage enables Git-based fundamental cache
          python run_optimized_scan.py --conservative --git-storage

      - name: Generate GitHub Pages HTML report
        run: |
          echo "=== Generating HTML Report ==="
          python generate_html_report.py \
            --input data/daily_scans/latest_scan_data.json \
            --output docs/index.html
          echo "✓ docs/index.html generated"

      - name: Show fundamental refresh stats
        if: always()
        run: |
          echo "=== Fundamental Cache Statistics ==="
          if [ -f "data/fundamentals_cache/metadata.json" ]; then
            python3 << 'PYTHON_SCRIPT'
          import json
          from datetime import datetime
          try:
              with open("data/fundamentals_cache/metadata.json", "r") as f:
                  metadata = json.load(f)
              updates = [(t, d["last_updated"]) for t, d in metadata.items()]
              updates.sort(key=lambda x: x[1], reverse=True)
              print(f"Total tracked: {len(updates)} stocks")
              print("\nLast 10 updates:")
              for ticker, ts in updates[:10]:
                  dt = datetime.fromisoformat(ts)
                  print(f"  {ticker}: {dt.strftime('%Y-%m-%d %H:%M')}")
          except Exception as e:
              print(f"Could not read metadata: {e}")
          PYTHON_SCRIPT
          else
            echo "No metadata file found"
          fi

      - name: Commit fundamental cache + HTML report
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage fundamental cache and GitHub Pages output
          git add data/fundamentals_cache/ docs/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            CHANGED_FILES=$(git diff --staged --name-only | wc -l)
            echo "Committing $CHANGED_FILES changed files"
            git commit -m "scan: S&P 500 daily screening + pages update - ${{ steps.date.outputs.date }}"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: steps.commit.outputs.has_changes == 'true'
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

      - name: Upload scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ steps.date.outputs.date }}
          path: |
            data/daily_scans/
            docs/index.html
          if-no-files-found: warn
          retention-days: 90

      - name: Cache size report
        if: always()
        run: |
          echo "=== Repository Impact ==="
          if [ -d "data/fundamentals_cache" ]; then
            echo "Fundamental cache: $(du -sh data/fundamentals_cache | cut -f1) ($(find data/fundamentals_cache -name '*.json' | wc -l | tr -d ' ') files)"
          fi
          if [ -f "docs/index.html" ]; then
            echo "HTML report: $(du -sh docs/index.html | cut -f1)"
          fi
